<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bgContact" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f6ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff7ef"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgContact)"/>
  <circle cx="410" cy="250" r="180" fill="#d6ecfb"/>
  <circle cx="100" cy="90" r="10" fill="#f7c948"/>
  <circle cx="712" cy="410" r="14" fill="#11a64a"/>
  <circle cx="692" cy="96" r="8" fill="#226fbd"/>

  <!-- main speech bubble -->
  <path d="M 260 150 h 320 a 28 28 0 0 1 28 28 v 130 a 28 28 0 0 1 -28 28 h -220 l -60 54 v -54 h -40 a 28 28 0 0 1 -28 -28 v -130 a 28 28 0 0 1 28 -28 z" fill="#226fbd"/>
  <circle cx="360" cy="264" r="10" fill="#ffffff"/>
  <circle cx="410" cy="264" r="10" fill="#ffffff"/>
  <circle cx="460" cy="264" r="10" fill="#ffffff"/>

  <!-- small heart bubble top right -->
  <g>
    <path d="M 520 90 h 150 a 20 20 0 0 1 20 20 v 66 a 20 20 0 0 1 -20 20 h -100 l -30 26 v -26 h -20 a 20 20 0 0 1 -20 -20 v -66 a 20 20 0 0 1 20 -20 z" fill="#f7c948"/>
    <path d="M 595 138 c -18 -14 -26 -24 -26 -36 c 0 -9 7 -15 15 -15 c 6 0 10 3 11 8 c 1 -5 5 -8 11 -8 c 8 0 15 6 15 15 c 0 12 -8 22 -26 36 z" fill="#0d2a52"/>
  </g>

  <!-- phone handset -->
  <g transform="translate(150,300)">
    <rect x="0" y="0" width="150" height="110" rx="18" fill="#0d2a52"/>
    <path d="M 30 20 c 20 30 40 50 70 60 c 8 -8 14 -10 22 -6 c 10 5 18 14 20 22 c 2 8 -2 14 -10 16 c -46 12 -100 -34 -118 -78 c -3 -8 1 -16 9 -18 c 3 -1 5 -1 7 0 z" fill="#e9f6ff"/>
  </g>

  <!-- envelope accent -->
  <g transform="translate(490,300)">
    <rect x="0" y="0" width="140" height="96" rx="12" fill="#11a64a"/>
    <path d="M 8 10 L 70 58 L 132 10" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

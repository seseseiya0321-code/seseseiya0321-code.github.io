  <rect width="800" height="500" fill="url(#bgArea)"/>
  <circle cx="400" cy="255" r="185" fill="#d6ecfb"/>
  <circle cx="96" cy="88" r="10" fill="#f7c948"/>
  <circle cx="708" cy="408" r="14" fill="#11a64a"/>
  <circle cx="686" cy="90" r="8" fill="#226fbd"/>

